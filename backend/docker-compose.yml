services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://resolveai:resolveai@db:5432/resolveai
      JWT_SECRET: troque-esta-chave-secreta
      JWT_EXPIRES_IN: 1d
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
