databases:
  - name: resolve-ai-db
    databaseName: resolveai
    user: resolveai
    plan: free

services:
  - type: web
    name: resolve-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PORT
        value: 3000

  - type: web
    name: resolve-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://resolve-ai-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
